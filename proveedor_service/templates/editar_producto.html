<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
</head>
<body>
    <h1>Editar Producto</h1>
    <form method="POST">
        Código Artículo: <input type="text" name="codigo_articulo" value="{{ producto.codigo_articulo }}" required><br>
        Nombre: <input type="text" name="nombre" value="{{ producto.nombre }}" required><br>
        Talle: <input type="text" name="talle" value="{{ producto.talle }}" required><br>
        Color: <input type="text" name="color" value="{{ producto.color }}" required><br>
        Stock: <input type="number" name="stock" value="{{ producto.stock }}" required><br>
        <input type="submit" value="Guardar Cambios">
    </form>
</body>
</html>
