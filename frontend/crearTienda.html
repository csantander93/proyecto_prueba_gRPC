<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nueva Tienda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menú de navegación con redirecciones -->
 <nav style="text-align: center; margin-bottom: 20px;">
    <a href="index.html" style="margin-right: 15px;">Stockearte</a>
    <a href="tienda.html" style="margin-right: 15px;">Tienda</a>
    <a href="usuario.html" style="margin-right: 15px;">Usuarios</a>
    <a href="producto.html">Productos</a>
    <button id="cerrarSesion" onclick="cerrarSesion()">Cerrar Sesión</button>
</nav>
    <div class="form-container">
        <form id="CrearTienda" action="/tiendas/crear" method="POST">
            <h1>Crear Nueva Tienda</h1>
            <label for="codigo">Código:</label>
            <input type="text" id="tiendaCodigo" name="codigo" required><br>
            <label for="direccion">Dirección:</label>
            <input type="text" id="tiendaDireccion" name="direccion" required><br>
            <label for="ciudad">Ciudad:</label>
            <input type="text" id="tiendaCiudad" name="ciudad" required><br>
            <label for="provincia">Provincia:</label>
            <input type="text" id="tiendaProvincia" name="provincia" required><br>
            <button onclick="submit">Confirmar Tienda</button>
        </form>
    </div>
</body>
<script>
    // Función para crear tienda
    document.getElementById('crearTiendaForm').addEventListener('submit', async (event) => {
            event.preventDefault();  // Evita el envío de formulario por defecto
            
            const tienda = {
                codigo: document.getElementById('tiendaCodigo').value,
                direccion: document.getElementById('tiendaDireccion').value,
                ciudad: document.getElementById('tiendaCiudad').value,
                provincia: document.getElementById('tiendaProvincia').value
            };

            try {
                const response = await fetch('/crear-tienda', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: {...tienda}
                });

                const result = await response.json();
                alert(result.mensaje || 'Tienda creada con éxito');
            } catch (error) {
                console.error('Error creando tienda:', error);
                alert('Hubo un error al crear la tienda.');
            }
        });

</script>
</html>
