<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Stock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Menú de navegación con redirecciones -->
<nav style="text-align: center; margin-bottom: 20px;">
    <a href="index.html" style="margin-right: 15px;">Stockearte</a>
    <a href="tienda.html" style="margin-right: 15px;">Tienda</a>
    <a href="usuario.html" style="margin-right: 15px;">Usuarios</a>
    <a href="producto.html">Productos</a>
    <a href="http://127.0.0.1:5000/cargar_usuarios" style="margin-right: 15px;">Carga masiva</a>
    <a href="http://127.0.0.1:5000/ordenes_compra" style="margin-right: 15px;">Ordenes de compras</a>
</nav>

<h1>Crear Nuevo Producto</h1>
<form id="crearProductoForm">
    <label for="codigo">Código:</label>
    <input type="text" id="codigo" name="codigo" required><br>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required><br>
    <label for="talle">Talle:</label>
    <input type="text" id="talle" name="talle" required><br>
    <label for="color">Color:</label>
    <input type="text" id="color" name="color" required><br>
    <label for="stock">Stock:</label>
    <input type="number" id="stock" name="stock" required><br>
    <label for="id_tienda">ID de Tienda:</label>
    <input type="number" id="id_tienda" name="id_tienda" required><br>
    <button type="submit">Crear Producto</button>
</form>
<script>
    async function verificarTienda(id_tienda) {
        try {
            const response = await fetch(`/buscarTienda/${id_tienda}`);
            if (!response.ok) {
                throw new Error('Tienda no encontrada');
            }
            const tienda = await response.json();
            return tienda;
        } catch (error) {
            console.error('Error verificando tienda:', error);
            return null;
        }
    }

    document.getElementById('crearProductoForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const id_tienda = parseInt(document.getElementById('id_tienda').value);
        const tienda = await verificarTienda(id_tienda);
        if (!tienda) {
            alert('Tienda no encontrada');
            return;
        }

        const producto = {
            codigo: document.getElementById('codigo').value,
            nombre: document.getElementById('nombre').value,
            talle: document.getElementById('talle').value,
            color: document.getElementById('color').value,
            stock: parseInt(document.getElementById('stock').value),
            id_tienda: id_tienda
        };

        try {
            const response = await fetch('/crearProducto', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(producto)
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText);
            }
            const result = await response.json();
            alert(result.mensaje || 'Producto creado con éxito');
        } catch (error) {
            console.error('Error creando producto:', error);
            alert('Error creando producto: ' + error.message);
        }
    });
</script>

    <!-- Vista para modificar producto -->
    <div class="form-container">
        <h2>Modificar Producto</h2>
        <input id="modificarProductoCodigo" placeholder="Código del Producto">
        <input id="modificarProductoNombre" placeholder="Nuevo Nombre">
        <input id="modificarProductoTalle" placeholder="Nuevo Talle">
        <input id="modificarProductoColor" placeholder="Nuevo Color">
        <input id="modificarProductoStock" placeholder="Nuevo Stock">
        <button onclick="modificarProducto()">Modificar Producto</button>
    </div> 

    <!-- Vista para eliminar producto -->
     <div class="form-container">
        <h2>Eliminar Producto</h2>
        <input id="eliminarProductoCodigo" placeholder="Código del Producto">
        <button onclick="eliminarProducto()">Eliminar Producto</button>
    </div> 

    <!-- Vista para buscar productos -->
     <div class="form-container">
        <h2>Buscar Productos</h2>
        <input id="busquedaProducto" placeholder="Nombre del Producto">
        <button onclick="buscarProductos()">Buscar</button>
    </div>
    <div id="resultados"></div> 
</body>
</html>
